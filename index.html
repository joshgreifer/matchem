<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, viewport-fit=cover">
    <title>Lexen</title>
    <style id="main-style">
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap');         /* As close as possible to News Gothic */

        :root {
            /*  Globally used vars */
            --backgound-edge-color: #616161;
            --background-middle-color: #ffffff;
            --game-background-color: #303030;
            --tile-background-color: #ffffff;
            --text-color: #ffffff;
            --dialog-background-color: #025771;
            --TRANSITION_TIME: 86400s;
            --TILE_SIZE: 56px;
        }
        html, body {
            font-family: moody-adolescent-regular,sans-serif;

            margin: 0;
            padding: 0;
            /*height: 100%;*/
            display: flex;
            flex-direction: column;
            color: var(--text-color);
            background-color: var(--game-background-color);
        }
/* Button styles */
        button {
            background-color: #007bff;      /* your brand color */
            color: white;                   /* text color */
            border: none;                   /* remove default border */
            padding: 0.5rem 1rem;           /* space inside button */
            font-size: 1rem;                /* control text size */
            border-radius: 4px;             /* rounded corners */
            cursor: pointer;                /* pointer on hover */
        }
        button:hover {
            background-color: #0056b3;      /* darker on hover */
        }
        button:active {
            transform: scale(0.98);         /* slight press effect */
        }
        button:disabled {
            opacity: 0.5;                   /* indicate disabled state */
            cursor: not-allowed;
        }

        /* Modal Dialog CSS */
        /* 1) Base hidden state */
        .modal {
            display: none;                /* hidden by default */
            position: fixed;              /* relative to viewport */
            inset: 0;                     /* top:0; right:0; bottom:0; left:0; */
            z-index: 9999;                /* on top of everything else */
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* 50% black */
        }

        /* 2) When active, switch to grid to center dialog */
        .modal.active {

            display: grid;                /* establish grid for centering */
            place-items: center;          /* center children both axes */
        }

        .modal__content {
            border-radius: 15px;
            filter: drop-shadow(4px 4px 4px #000000);

            display: grid;                /* establish grid for centering */
            place-items: center;          /* center children both axes */
            width: 70vw;
            height: 42vw;
            background: linear-gradient(rgba(2, 87, 113, 0.60), rgba(0, 34, 48, 0.60));

            color: var(--text-color);
            font-size: 18px;
        }

        .modal_message {
            margin: 0;
            padding: 1em;
            text-align: center;
            font-size: 1.2em;
            color: var(--text-color);
        }
        /*
        !!IMPORTANT!!
        This increasing-pulse keyframes CSS rule must remain commented-out!
        It's just shown here for reference.
        An "increasing-pulse" rule is inserted and modified dynamically in the JavaScript code,
        which also maintains a handle to its index in the stylesheet for quick access to it.

                @keyframes increasing-pulse {
                    0% { opacity: 1; }
                    16% { opacity: .5; }
                    32% { opacity: 1; }
                    48% { opacity: .5; }
                    64% { opacity: 1; }
                    80% { opacity: .5; }
                    96% { opacity: 1; }
                }

         */

        div {
            -moz-user-select: none;
            -html-user-select: none;
            -webkit-user-select: none;

            /*
              Introduced in Internet Explorer 10.
              See http://ie.microsoft.com/testdrive/HTML5/msUserSelect/
            */
            -ms-user-select: none;
            user-select: none;
        }

        div#layout {
            /*overflow: hidden;*/
            min-height: 90vh;
            height: 90vh;
            box-sizing: border-box;
            display: grid;
            /*grid-template-rows: auto auto auto;*/
            grid-template-columns: 1fr 120px;
            grid-template-rows: 1fr 64px 64px;
            grid-template-areas:
                "deck timer-bar"
                "build-word build-word"
                "valid-word game-status";
            align-items: center;
            text-align: center;
            margin: 5vh 5vw;

        }
        .deck {
            /*aspect-ratio: 1/1; !* Maintain a square aspect ratio *!*/
            /*border: 1px solid red;*/
            grid-area: deck;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            /*position: relative;*/
            background-color: var(--game-background-color);

        }

        @font-face {
            font-family: 'Roboto', Arial, Verdana, sans-serif;
        }


        div#timer-bar {
            justify-self: end;
            height: 100%;
            width: 20px;
            grid-area: timer-bar;
            /*background: linear-gradient(to top, #ff0000 0%, #ff0000 10%, #0091c3 30%, #0091c3 90%, #00ff00 95%, #00ff00 100%);*/

        }
        .timer-fill {
            width: 100%;
            height: 100%;
            background-color: var(--game-background-color);

        }
        @keyframes barColorChange {
            100% { background-color: #ff0000; }   /* Start, fill fully covers bar: top is red */
            90% { background-color: #ff0000; }
            70% { background-color: #0091c3; }
            10% { background-color: #0091c3; }
            5% { background-color: #00ff00; }
            0% { background-color: #00ff00; }   /* End, fill gone: bottom is green */
        }


        .timer-fill.animate {
            animation:
                    drain var(--TRANSITION_TIME) linear forwards,
                    barColorChange var(--TRANSITION_TIME) linear forwards;
        }

        @keyframes drain {
            from {
                height: 0;
            }
            to {
                height: 100%;
            }
        }

        div#game-status {
            grid-area: game-status;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1em; /* Space between score, word, and tick */
        }
        div#valid-word {
            border: 1px solid red; /* while testing - remove later */

            grid-area: valid-word;
        }
        
        .build-word-container {

            grid-area: build-word;
            display: flex;

            /*justify-content: center;*/
            flex-direction:     row;
            align-items: center;
            gap: 1em; /* Space between score, word, and tick */



        }
        #word {
            width: calc(11 * var(--TILE_SIZE)); /* 10 tiles + 1px border */
            height: var(--TILE_SIZE);
            display: flex;
            flex-direction: row;
            align-items: center;   /* Optional: vertically center the tiles */
            justify-content: flex-start; /* Optional: align left */
            /*gap: 0.5em; !* Optional: add space between tiles *!*/
            min-height: 1em; /* Prevent collapse when empty */
        }
        #word > :nth-child(7).background {
            /* Your styles for the 7th child, e.g.: */
            background: gold;
            /* or add the "double-word-bonus" class via JS: */
        }
        .background {
            width: var(--TILE_SIZE);
            height: var(--TILE_SIZE);
            margin: 2px;
            background: linear-gradient(145deg, #000000 60%, #d9c08b 100%);
        }
        .scrabble-tile {
            display: inline-block;
            position: relative;
            margin: 2px;
            width: var(--TILE_SIZE);
            height: var(--TILE_SIZE);
            background: linear-gradient(145deg, #f5e8cb 60%, #d9c08b 100%);
            border-radius: 3px;
            box-shadow:
                    0 2px 4px 0 #bfa97c,       /* outer shadow */
                    inset 2px 2px 4px #fff8e1, /* highlight */
                    inset -2px -2px 4px #bda875; /* bevel/dark */
            border: 1px solid #b29e6b;
            font-family: 'Roboto', Arial, Verdana, sans-serif;
            font-weight: bold;
            color: #42361e;
            text-align: center;
            line-height: var(--TILE_SIZE);
            font-size: calc( var(--TILE_SIZE) * .5 ); /* Adjust font size based on tile size */
            user-select: none;
        }
        .scrabble-tile::after {
            content: attr(data-value);
            position: absolute;
            bottom: 7px;
            right: 10px;
            font-size: .75rem;
            font-family: 'Roboto', Arial, Verdana, sans-serif;
            color: #392c17;
            font-weight: bold;
            /*opacity: 0.82;*/
            line-height: 1;
        }

        div.selected {
            background: linear-gradient(135deg, #ff8585 0%, #ff0000 100%);
        }
        /* Force every tile to be a square */



        div.rotateOut {
            transform: rotateY(90deg);
            transition: transform 0.5s;
        }

        div.rotateBack {
            transform: rotateY(-360deg);
            transition: transform 0.6s;
        }

        .tick {
            display: none;
        }

        @keyframes hintCycle {

            0%   { transform: scale(150%); }
            50% { transform: scale(175%); }
            100% { transform: scale(150%); }
         }

        .tick.hint {

            vertical-align: middle;
            text-align: center;
            width: 30px;
            height: 30px;
            line-height: 30px;
            border-radius: 25%;
            background: linear-gradient(135deg, #f63737 0%, #550000 100%);
            display: inline-block;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1em;
            user-select: none;
            margin-left: 30px;
            animation: hintCycle 1s ease-in-out infinite;
        }

        #bonus-badge {
            width: 32px;
        }

    </style>
</head>
<body>

<div id="layout">
    <div class="deck"></div>

        <div id="timer-bar">
            <div class="timer-fill"></div>
        </div>


    <div class="build-word-container">
        <div id="word"></div>
    </div>
    <div id="valid-word">
        <span id="looked-up-word"></span>
        <span id="bonus-badge"></span>
        <span id="score"></span>
        <span class="tick" title="Click to confirm word">&#x2714;</span>
    </div>
    <div id="game-status">

        <span>
            <button class="give-up-button">Give Up</button>
        </span>
    </div>

</div>

<div id="modal" class="modal">
    <div class="modal__content">
        <p class="modal_message">(Modal Dialog message)</p>
        <button class="modal__ok">OK</button>
    </div>
</div>


</body>
<script src="assets/wordlist/wordlist.js"></script>
<script src="index.js"></script>
</html>
